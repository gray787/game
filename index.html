<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MadGames - Free Online Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-gamepad"></i> <span>MAD<b>GAMES</b></span>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search for games...">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="nav-actions">
            <button class="btn-submit">Submit a Game</button>
            <button class="btn-login">Log In</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <nav>
                <a href="#" class="active"><i class="fa-solid fa-fire"></i> Trending</a>
                <a href="#"><i class="fa-solid fa-bolt"></i> New Games</a>
                <a href="#"><i class="fa-solid fa-gun"></i> Action</a>
                <a href="#"><i class="fa-solid fa-car"></i> Driving</a>
                <a href="#"><i class="fa-solid fa-puzzle-piece"></i> Puzzle</a>
                <a href="#"><i class="fa-solid fa-user-group"></i> 2 Player</a>
                <a href="#"><i class="fa-solid fa-chess"></i> Strategy</a>
            </nav>
        </aside>

        <main class="content">
            <h2><i class="fa-solid fa-fire" style="color: #ff5722;"></i> Featured Games</h2>
            
            <div class="game-grid">
                <div class="game-card">
                    <img src="https://images.unsplash.com/photo-1612287230202-1bf1d85d1bdf?w=400" alt="Game Thumbnail">
                    <div class="game-info">
                        <span class="game-title">Cyber Racer 3D</span>
                        <span class="game-tag">Driving</span>
                    </div>
                </div>

                <div class="game-card">
                    <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=400" alt="Game Thumbnail">
                    <div class="game-info">
                        <span class="game-title">Pixel Commando</span>
                        <span class="game-tag">Action</span>
                    </div>
                </div>

                <div class="game-card">
                    <img src="https://images.unsplash.com/photo-1551103782-8ab07afd45c1?w=400" alt="Game Thumbnail">
                    <div class="game-info">
                        <span class="game-title">Shadow Arena</span>
                        <span class="game-tag">2 Player</span>
                    </div>
                </div>

                <div class="game-card">
                    <img src="https://images.unsplash.com/photo-1614624532983-4ce03382d63d?w=400" alt="Game Thumbnail">
                    <div class="game-info">
                        <span class="game-title">Brain Out Quiz</span>
                        <span class="game-tag">Puzzle</span>
                    </div>
                </div>
                
                </div>
        </main>
    </div>

</body>
</html>
